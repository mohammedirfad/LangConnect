services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: landconnect
      POSTGRES_USER: landconnect
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landconnect -d landconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
